<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">V2.6.1 Flight Deck Signal Flow — small window</title>
  <desc id="desc">A proposed small-window Flight Deck Signal Flow layout with compact command strip, large graph, and an inspector overlay rather than permanent sidebars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1721"/><stop offset="1" stop-color="#071017"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M 42 0 L 0 0 0 42" fill="none" stroke="#244354" stroke-width="1"/></pattern>
    <style>
      .label { fill:#eaf6fb; font-family:'Segoe UI',Arial,sans-serif; }
      .muted { fill:#89a5b5; font-family:'Segoe UI',Arial,sans-serif; }
      .tech { fill:#75cfe5; font-family:Consolas,monospace; font-size:10px; font-weight:700; letter-spacing:.7px; }
      .card { fill:#162b3a; stroke:#356078; stroke-width:1.4; }
      .panel { fill:#173444; stroke:#4dc5df; stroke-width:1.5; }
      .wire { fill:none; stroke:#65ca98; stroke-width:3; }
      .port { fill:#61ca92; stroke:#e2fff0; stroke-width:2; }
      .in { fill:#77d8ed; stroke:#e2fbff; stroke-width:2; }
    </style>
  </defs>
  <rect width="1200" height="740" fill="url(#bg)"/>
  <rect x="22" y="20" width="1156" height="66" rx="18" fill="#112433" stroke="#355a70"/>
  <text x="48" y="48" class="label" font-size="22" font-weight="700">Signal Flow</text>
  <text x="48" y="69" class="muted" font-size="11">SMALL-WINDOW TARGET · NO THREE-COLUMN FALLBACK</text>
  <rect x="420" y="32" width="130" height="32" rx="16" fill="#19384a" stroke="#3e7189"/><text x="442" y="53" class="label" font-size="12">Rig ▾</text>
  <rect x="562" y="32" width="130" height="32" rx="16" fill="#19384a" stroke="#3e7189"/><text x="584" y="53" class="label" font-size="12">Profile ▾</text>
  <text x="734" y="53" class="tech">CONFIGURED · LIVE · •••</text>

  <rect x="22" y="104" width="1156" height="614" rx="20" fill="#0b1a24" stroke="#31586d"/>
  <rect x="44" y="126" width="1112" height="570" rx="14" fill="url(#grid)" stroke="#27495c"/>
  <text x="65" y="153" class="tech">GRAPH WORKSPACE · OVERVIEW/COMPACT ADAPTS BEFORE CHROME EXPANDS</text>

  <rect x="92" y="263" width="228" height="190" rx="16" class="card"/>
  <text x="116" y="300" class="label" font-size="16" font-weight="700">Joystick</text><text x="116" y="324" class="tech">AXES</text>
  <text x="116" y="365" class="label" font-size="13">Roll</text><circle cx="320" cy="359" r="10" class="port"/>
  <text x="116" y="405" class="label" font-size="13">Pitch</text><circle cx="320" cy="399" r="10" class="port"/>
  <path d="M 330 359 C 500 359, 650 318, 886 318" class="wire"/>
  <path d="M 330 399 C 500 399, 650 370, 886 370" class="wire"/>
  <rect x="886" y="245" width="196" height="210" rx="16" class="card"/>
  <text x="910" y="281" class="label" font-size="16" font-weight="700">vJoy 1</text><text x="910" y="305" class="tech">OUTPUT</text>
  <circle cx="886" cy="318" r="10" class="in"/><text x="915" y="324" class="label" font-size="13">X</text>
  <circle cx="886" cy="370" r="10" class="in"/><text x="915" y="376" class="label" font-size="13">Y</text>

  <rect x="742" y="467" width="340" height="194" rx="16" class="panel"/>
  <text x="765" y="497" class="tech">ROUTE INSPECTOR · OVERLAY</text>
  <text x="765" y="528" class="label" font-size="15" font-weight="700">Roll → X</text>
  <text x="765" y="555" class="muted" font-size="12">Curve · Ready · Live</text>
  <rect x="765" y="578" width="194" height="31" rx="9" fill="#1b5367"/><text x="783" y="599" class="label" font-size="12">Add Processor</text>
  <rect x="765" y="618" width="194" height="31" rx="9" fill="#1b3845"/><text x="783" y="639" class="label" font-size="12">Close inspector</text>
  <text x="65" y="680" class="muted" font-size="11">The contextual inspector overlays the canvas; closing it restores full workspace width.</text>
</svg>
