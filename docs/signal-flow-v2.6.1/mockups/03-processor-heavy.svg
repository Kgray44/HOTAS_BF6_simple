<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">V2.6.1 Flight Deck Signal Flow — processor-heavy route</title>
  <desc id="desc">A proposed signal route with Curve, Deadzone, and Adaptive Response processor cards visibly embedded between direct device and virtual output ports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1721"/><stop offset="1" stop-color="#071017"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#244354" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label { fill:#eaf6fb; font-family:'Segoe UI',Arial,sans-serif; }
      .muted { fill:#89a5b5; font-family:'Segoe UI',Arial,sans-serif; }
      .tech { fill:#75cfe5; font-family:Consolas,monospace; font-size:11px; font-weight:700; letter-spacing:1px; }
      .card { fill:#162b3a; stroke:#356078; stroke-width:1.5; }
      .proc { fill:#183443; stroke:#4dc5df; stroke-width:1.8; }
      .wire { fill:none; stroke:#65ca98; stroke-width:4; }
      .port { fill:#61ca92; stroke:#e2fff0; stroke-width:2; }
      .in { fill:#77d8ed; stroke:#e2fbff; stroke-width:2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="34" y="28" width="1532" height="78" rx="22" fill="#112433" stroke="#355a70"/>
  <text x="65" y="64" class="label" font-size="28" font-weight="700">Signal Flow</text>
  <text x="65" y="87" class="muted" font-size="13">PROPOSED V2.6.1 · PROCESSOR-HEAVY ROUTE</text>
  <text x="1172" y="72" class="tech">CONFIGURED  ·  LIVE  ·  CURVE EDITOR LINKED</text>
  <rect x="34" y="128" width="1532" height="736" rx="24" fill="#0b1a24" stroke="#31586d"/>
  <rect x="58" y="152" width="1484" height="688" rx="18" fill="url(#grid)" stroke="#27495c"/>
  <text x="82" y="185" class="tech">ACTUAL PROCESSOR PORTS SPLIT THE VISIBLE ROUTE</text>

  <rect x="120" y="324" width="278" height="195" rx="18" class="card"/>
  <circle cx="151" cy="356" r="6" fill="#61ca92"/><text x="168" y="363" class="label" font-size="18" font-weight="700">Joystick</text>
  <text x="151" y="389" class="tech">AXES · CONNECTED</text>
  <rect x="148" y="421" width="218" height="52" rx="10" fill="#112330" stroke="#294c60"/>
  <text x="166" y="454" class="label" font-size="15">Roll</text><circle cx="398" cy="447" r="11" class="port"/>

  <path d="M 409 447 L 535 447" class="wire"/>
  <path d="M 733 447 L 793 447" class="wire"/>
  <path d="M 991 447 L 1051 447" class="wire"/>
  <path d="M 1249 447 L 1308 447" class="wire" filter="url(#glow)"/>

  <rect x="535" y="355" width="198" height="184" rx="17" class="proc"/>
  <text x="561" y="389" class="label" font-size="17" font-weight="700">Curve</text>
  <text x="561" y="413" class="tech">SOURCE CHAIN</text>
  <text x="561" y="450" class="muted" font-size="13">S-curve · 50%</text>
  <text x="561" y="475" class="muted" font-size="13">Open Curve Editor ↗</text>
  <circle cx="535" cy="447" r="11" class="in"/><circle cx="733" cy="447" r="11" class="port"/>
  <text x="552" y="522" class="tech">IN                 OUT</text>

  <rect x="793" y="355" width="198" height="184" rx="17" class="proc"/>
  <text x="819" y="389" class="label" font-size="17" font-weight="700">Deadzone</text>
  <text x="819" y="413" class="tech">SOURCE CHAIN</text>
  <text x="819" y="450" class="muted" font-size="13">8% center suppression</text>
  <circle cx="793" cy="447" r="11" class="in"/><circle cx="991" cy="447" r="11" class="port"/>
  <text x="810" y="522" class="tech">IN                 OUT</text>

  <rect x="1051" y="355" width="198" height="184" rx="17" class="proc"/>
  <text x="1077" y="389" class="label" font-size="17" font-weight="700">Adaptive Response</text>
  <text x="1077" y="413" class="tech">SOURCE CHAIN</text>
  <text x="1077" y="450" class="muted" font-size="13">Active · ±0.24 lead</text>
  <circle cx="1051" cy="447" r="11" class="in"/><circle cx="1249" cy="447" r="11" class="port"/>
  <text x="1068" y="522" class="tech">IN                 OUT</text>

  <rect x="1308" y="324" width="204" height="195" rx="18" class="card"/>
  <text x="1336" y="363" class="label" font-size="18" font-weight="700">vJoy 1</text>
  <text x="1336" y="389" class="tech">VIRTUAL OUTPUT</text>
  <rect x="1336" y="421" width="145" height="52" rx="10" fill="#112330" stroke="#294c60"/>
  <circle cx="1308" cy="447" r="11" class="in"/><text x="1353" y="454" class="label" font-size="15">X</text>

  <rect x="450" y="650" width="702" height="92" rx="16" fill="#122b38" stroke="#3a7184"/>
  <text x="480" y="684" class="label" font-size="16" font-weight="700">Insertion preview is structural, not decorative.</text>
  <text x="480" y="711" class="muted" font-size="14">The selected segment splits at real ports; source-wide fan-out impact is stated before commit.</text>
  <text x="82" y="814" class="muted" font-size="12">Right-click the actual highlighted wire to add, inspect, or remove processing.</text>
</svg>
