<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">V2.6.1 Flight Deck Signal Flow — simple direct route</title>
  <desc id="desc">A proposed graph-first Flight Deck layout showing a controller card, direct source ports, a vJoy output card, direct destination ports, and two visible wires.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1721"/><stop offset="1" stop-color="#071017"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#244354" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label { fill:#eaf6fb; font-family:'Segoe UI',Arial,sans-serif; }
      .muted { fill:#89a5b5; font-family:'Segoe UI',Arial,sans-serif; }
      .tech { fill:#75cfe5; font-family:Consolas,monospace; font-size:12px; font-weight:700; letter-spacing:1px; }
      .card { fill:#162b3a; stroke:#356078; stroke-width:1.5; }
      .row { fill:#112330; stroke:#294c60; stroke-width:1; }
      .wire { fill:none; stroke:#65ca98; stroke-width:4; }
      .port-in { fill:#77d8ed; stroke:#d9fbff; stroke-width:2; }
      .port-out { fill:#61ca92; stroke:#ddffe8; stroke-width:2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="36" y="30" width="1528" height="78" rx="22" fill="#112433" stroke="#355a70"/>
  <text x="68" y="66" class="label" font-size="28" font-weight="700">Signal Flow</text>
  <text x="68" y="88" class="muted" font-size="13">PROPOSED V2.6.1 · GRAPH-FIRST REFERENCE · SIMPLE ROUTE</text>
  <rect x="500" y="49" width="190" height="38" rx="19" fill="#19384a" stroke="#3e7189"/>
  <text x="522" y="73" class="label" font-size="14">Device Rig  ▾</text>
  <rect x="706" y="49" width="166" height="38" rx="19" fill="#19384a" stroke="#3e7189"/>
  <text x="727" y="73" class="label" font-size="14">Profile  ▾</text>
  <rect x="1076" y="49" width="130" height="38" rx="19" fill="#1b5367" stroke="#6bd5ed"/>
  <text x="1097" y="73" class="label" font-size="14" font-weight="700">Configured</text>
  <text x="1231" y="73" class="muted" font-size="14">Effective</text>
  <text x="1385" y="73" class="tech">UNDO  REDO  LIVE  •••</text>

  <rect x="36" y="130" width="1528" height="730" rx="24" fill="#0b1a24" stroke="#31586d"/>
  <rect x="60" y="154" width="1480" height="682" rx="18" fill="url(#grid)" stroke="#27495c"/>
  <text x="86" y="190" class="tech">GRAPH WORKSPACE · 88% OF USABLE SIGNAL FLOW AREA</text>

  <path d="M 481 367 C 660 367, 840 367, 1112 367" class="wire" filter="url(#glow)"/>
  <path d="M 481 431 C 680 431, 850 431, 1112 431" class="wire" opacity=".74"/>
  <text x="690" y="346" class="tech" fill="#78db9e">VISIBLE ROUTE · HOVER / CLICK / RIGHT-CLICK</text>

  <rect x="170" y="270" width="312" height="310" rx="18" class="card"/>
  <circle cx="200" cy="306" r="7" fill="#61ca92"/>
  <text x="218" y="312" class="label" font-size="19" font-weight="700">T.Flight Hotas One</text>
  <text x="198" y="337" class="tech">CONNECTED · VERIFIED</text>
  <text x="198" y="374" class="label" font-size="15" font-weight="700">Axes</text>
  <rect x="194" y="390" width="264" height="46" rx="9" class="row"/>
  <text x="210" y="419" class="label" font-size="15">Roll</text>
  <circle cx="469" cy="413" r="11" class="port-out"/>
  <rect x="194" y="454" width="264" height="46" rx="9" class="row"/>
  <text x="210" y="483" class="label" font-size="15">Pitch</text>
  <circle cx="469" cy="477" r="11" class="port-out"/>
  <text x="198" y="535" class="muted" font-size="13">Buttons  ›     POVs  ›</text>
  <text x="194" y="620" class="tech">SOURCE PORTS LIVE ON THIS CARD</text>

  <rect x="1114" y="270" width="314" height="310" rx="18" class="card"/>
  <circle cx="1400" cy="306" r="7" fill="#61ca92"/>
  <text x="1140" y="312" class="label" font-size="19" font-weight="700">vJoy Device 1</text>
  <text x="1140" y="337" class="tech">READY · VIRTUAL OUTPUT</text>
  <text x="1140" y="374" class="label" font-size="15" font-weight="700">Virtual Axes</text>
  <rect x="1138" y="390" width="264" height="46" rx="9" class="row"/>
  <circle cx="1124" cy="413" r="11" class="port-in"/>
  <text x="1158" y="419" class="label" font-size="15">X</text>
  <rect x="1138" y="454" width="264" height="46" rx="9" class="row"/>
  <circle cx="1124" cy="477" r="11" class="port-in"/>
  <text x="1158" y="483" class="label" font-size="15">Y</text>
  <text x="1140" y="535" class="muted" font-size="13">Buttons  ›     POVs  ›</text>
  <text x="1138" y="620" class="tech">DESTINATION PORTS LIVE ON THIS CARD</text>

  <rect x="522" y="688" width="558" height="78" rx="14" fill="#122b38" stroke="#3a7184"/>
  <text x="548" y="721" class="label" font-size="16" font-weight="700">No persistent bus. No route lane.</text>
  <text x="548" y="747" class="muted" font-size="14">Ports are the routing controls; the wire is the route control.</text>
  <text x="68" y="822" class="muted" font-size="12">Phase 0 review artifact · not production QML · canvas returns to full width when nothing is selected</text>
</svg>
