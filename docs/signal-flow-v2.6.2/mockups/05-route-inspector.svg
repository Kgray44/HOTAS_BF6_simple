<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">V2.6.2 Flight Deck Signal Flow — selected route inspector</title>
  <desc id="desc">A proposed Flight Deck graph with a selected visible route and a contextual route inspector that does not operate as a destination browser.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1721"/><stop offset="1" stop-color="#071017"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#244354" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label { fill:#eaf6fb; font-family:'Segoe UI',Arial,sans-serif; }
      .muted { fill:#89a5b5; font-family:'Segoe UI',Arial,sans-serif; }
      .tech { fill:#75cfe5; font-family:Consolas,monospace; font-size:11px; font-weight:700; letter-spacing:1px; }
      .card { fill:#162b3a; stroke:#356078; stroke-width:1.5; }
      .panel { fill:#162d3c; stroke:#4dc5df; stroke-width:1.5; }
      .row { fill:#112330; stroke:#294c60; stroke-width:1; }
      .wire { fill:none; stroke:#65ca98; stroke-width:3.5; }
      .selected { fill:none; stroke:#78d8ed; stroke-width:8; }
      .port { fill:#61ca92; stroke:#e2fff0; stroke-width:2; }
      .in { fill:#77d8ed; stroke:#e2fbff; stroke-width:2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="34" y="28" width="1532" height="78" rx="22" fill="#112433" stroke="#355a70"/>
  <text x="65" y="64" class="label" font-size="28" font-weight="700">Signal Flow</text>
  <text x="65" y="87" class="muted" font-size="13">PROPOSED V2.6.2 · SELECTED ROUTE WITH CONTEXTUAL INSPECTOR</text>
  <text x="1147" y="72" class="tech">SEARCH   UNDO   REDO   LIVE   •••</text>
  <rect x="34" y="128" width="1532" height="736" rx="24" fill="#0b1a24" stroke="#31586d"/>
  <rect x="58" y="152" width="1120" height="688" rx="18" fill="url(#grid)" stroke="#27495c"/>
  <text x="82" y="185" class="tech">GRAPH WORKSPACE · INSPECTOR OPEN ONLY FOR THE CURRENT SELECTION</text>

  <rect x="130" y="300" width="280" height="255" rx="18" class="card"/>
  <text x="158" y="341" class="label" font-size="19" font-weight="700">T.Flight Hotas One</text>
  <text x="158" y="367" class="tech">CONNECTED · VERIFIED</text>
  <rect x="158" y="405" width="220" height="55" rx="10" class="row"/>
  <text x="176" y="439" class="label" font-size="15">Roll</text><circle cx="410" cy="432" r="11" class="port"/>
  <rect x="158" y="475" width="220" height="40" rx="10" class="row"/><text x="176" y="501" class="muted" font-size="13">Pitch</text>

  <rect x="595" y="350" width="190" height="160" rx="17" fill="#183443" stroke="#61ca92" stroke-width="2"/>
  <text x="620" y="390" class="label" font-size="17" font-weight="700">Curve</text>
  <text x="620" y="415" class="tech">PROCESSOR</text>
  <text x="620" y="447" class="muted" font-size="13">S-curve · 50%</text>
  <circle cx="595" cy="432" r="11" class="in"/><circle cx="785" cy="432" r="11" class="port"/>

  <rect x="982" y="300" width="162" height="255" rx="18" class="card"/>
  <text x="1008" y="341" class="label" font-size="18" font-weight="700">vJoy 1</text>
  <text x="1008" y="367" class="tech">OUTPUT</text>
  <rect x="1008" y="405" width="104" height="55" rx="10" class="row"/>
  <circle cx="982" cy="432" r="11" class="in"/><text x="1030" y="439" class="label" font-size="15">X</text>

  <path d="M 421 432 C 485 432, 535 432, 595 432" class="selected" filter="url(#glow)"/>
  <path d="M 421 432 C 485 432, 535 432, 595 432" class="wire"/>
  <path d="M 785 432 C 853 432, 914 432, 982 432" class="wire"/>
  <circle cx="506" cy="432" r="6" fill="#eaf6fb"/><text x="454" y="401" class="tech" fill="#78d8ed">SELECTED VISIBLE SEGMENT</text>

  <rect x="1202" y="152" width="340" height="688" rx="18" class="panel"/>
  <text x="1228" y="190" class="tech">ROUTE INSPECTOR</text>
  <text x="1228" y="224" class="label" font-size="18" font-weight="700">Roll  →  Curve  →  X</text>
  <line x1="1228" y1="244" x2="1514" y2="244" stroke="#3a6578"/>
  <text x="1228" y="280" class="tech">SOURCE</text>
  <text x="1228" y="305" class="label" font-size="14">T.Flight Hotas One · Roll</text>
  <text x="1228" y="345" class="tech">PROCESSING</text>
  <text x="1228" y="370" class="label" font-size="14">Curve · S-curve · 50%</text>
  <rect x="1228" y="389" width="256" height="36" rx="10" fill="#1b5367"/><text x="1247" y="413" class="label" font-size="13">Open Curve Editor</text>
  <text x="1228" y="465" class="tech">DESTINATION</text>
  <text x="1228" y="490" class="label" font-size="14">vJoy Device 1 · X</text>
  <text x="1228" y="530" class="tech">HEALTH</text>
  <text x="1228" y="555" fill="#61ca92" font-family="Consolas,monospace" font-size="13" font-weight="700">READY · LIVE SAMPLE 0.421</text>
  <text x="1228" y="605" class="tech">ACTIONS</text>
  <rect x="1228" y="623" width="256" height="38" rx="10" fill="#1b5367"/><text x="1247" y="648" class="label" font-size="13">Add Processor</text>
  <rect x="1228" y="672" width="256" height="38" rx="10" fill="#1b3845"/><text x="1247" y="697" class="label" font-size="13">Explain Route</text>
  <rect x="1228" y="721" width="256" height="38" rx="10" fill="#56323a" stroke="#f08089"/><text x="1247" y="746" class="label" font-size="13">Disconnect</text>
  <text x="1228" y="800" class="muted" font-size="12">The inspector explains selection. It never lists destination ports.</text>
</svg>
