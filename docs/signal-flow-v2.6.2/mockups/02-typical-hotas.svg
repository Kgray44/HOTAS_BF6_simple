<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">V2.6.2 Flight Deck Signal Flow — typical HOTAS</title>
  <desc id="desc">A proposed multi-device graph with joystick, throttle, pedals, button box, and vJoy output cards all on the canvas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1721"/><stop offset="1" stop-color="#071017"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#244354" stroke-width="1"/></pattern>
    <style>
      .label { fill:#eaf6fb; font-family:'Segoe UI',Arial,sans-serif; }
      .muted { fill:#89a5b5; font-family:'Segoe UI',Arial,sans-serif; }
      .tech { fill:#75cfe5; font-family:Consolas,monospace; font-size:11px; font-weight:700; letter-spacing:1px; }
      .card { fill:#162b3a; stroke:#356078; stroke-width:1.5; }
      .wire { fill:none; stroke:#65ca98; stroke-width:3.5; }
      .port { fill:#61ca92; stroke:#e2fff0; stroke-width:2; }
      .in { fill:#77d8ed; stroke:#e2fbff; stroke-width:2; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="34" y="28" width="1532" height="78" rx="22" fill="#112433" stroke="#355a70"/>
  <text x="65" y="64" class="label" font-size="28" font-weight="700">Signal Flow</text>
  <text x="65" y="87" class="muted" font-size="13">PROPOSED V2.6.2 · TYPICAL MULTI-DEVICE HOTAS</text>
  <text x="1130" y="72" class="tech">RIG: BF6 HELICOPTER  ·  PROFILE: NORMAL  ·  LIVE</text>
  <rect x="34" y="128" width="1532" height="736" rx="24" fill="#0b1a24" stroke="#31586d"/>
  <rect x="58" y="152" width="1484" height="688" rx="18" fill="url(#grid)" stroke="#27495c"/>
  <text x="82" y="185" class="tech">ALL RIG MEMBERS COEXIST · SOURCE OWNER IS INFERRED FROM THE PORT</text>

  <path d="M 389 286 C 630 286, 818 266, 1134 266" class="wire"/>
  <path d="M 389 335 C 640 335, 850 322, 1134 322" class="wire"/>
  <path d="M 389 466 C 630 466, 834 435, 1134 435" class="wire"/>
  <path d="M 389 593 C 650 593, 815 548, 1134 548" class="wire"/>
  <path d="M 389 713 C 650 713, 870 671, 1134 671" class="wire"/>
  <text x="630" y="246" class="tech" fill="#78db9e">NO “EDIT THIS INPUT SCOPE” STEP</text>

  <rect x="130" y="224" width="260" height="140" rx="17" class="card"/>
  <circle cx="157" cy="254" r="6" fill="#61ca92"/><text x="174" y="261" class="label" font-size="17" font-weight="700">Joystick</text>
  <text x="157" y="286" class="tech">CONNECTED · 2 AXES</text>
  <text x="157" y="319" class="label" font-size="14">Roll</text><circle cx="389" cy="314" r="10" class="port"/>
  <text x="157" y="347" class="label" font-size="14">Pitch</text><circle cx="389" cy="342" r="10" class="port"/>

  <rect x="130" y="404" width="260" height="140" rx="17" class="card"/>
  <circle cx="157" cy="434" r="6" fill="#61ca92"/><text x="174" y="441" class="label" font-size="17" font-weight="700">Throttle</text>
  <text x="157" y="466" class="tech">CONNECTED · 1 AXIS</text>
  <text x="157" y="507" class="label" font-size="14">Throttle</text><circle cx="389" cy="502" r="10" class="port"/>

  <rect x="130" y="578" width="260" height="140" rx="17" class="card"/>
  <circle cx="157" cy="608" r="6" fill="#61ca92"/><text x="174" y="615" class="label" font-size="17" font-weight="700">Pedals</text>
  <text x="157" y="640" class="tech">CONNECTED · 1 AXIS</text>
  <text x="157" y="681" class="label" font-size="14">Yaw</text><circle cx="389" cy="676" r="10" class="port"/>

  <rect x="476" y="648" width="250" height="108" rx="17" class="card"/>
  <circle cx="503" cy="679" r="6" fill="#e7ad55"/><text x="520" y="686" class="label" font-size="17" font-weight="700">Button Box</text>
  <text x="503" y="712" class="tech">CONNECTED · BUTTONS</text>
  <text x="503" y="738" class="label" font-size="14">Fire</text><circle cx="726" cy="733" r="10" class="port"/>

  <rect x="1136" y="204" width="295" height="560" rx="20" class="card"/>
  <circle cx="1403" cy="234" r="7" fill="#61ca92"/><text x="1164" y="241" class="label" font-size="19" font-weight="700">vJoy Device 1</text>
  <text x="1164" y="266" class="tech">OUTPUT · READY</text>
  <text x="1164" y="311" class="label" font-size="15" font-weight="700">Virtual Axes</text>
  <circle cx="1125" cy="266" r="10" class="in"/><text x="1164" y="326" class="label" font-size="14">X  · Roll</text>
  <circle cx="1125" cy="322" r="10" class="in"/><text x="1164" y="382" class="label" font-size="14">Y  · Pitch</text>
  <circle cx="1125" cy="435" r="10" class="in"/><text x="1164" y="495" class="label" font-size="14">Slider  · Throttle</text>
  <circle cx="1125" cy="548" r="10" class="in"/><text x="1164" y="608" class="label" font-size="14">Rz  · Yaw</text>
  <text x="1164" y="658" class="label" font-size="15" font-weight="700">Buttons</text>
  <circle cx="1125" cy="671" r="10" class="in"/><text x="1164" y="688" class="label" font-size="14">Button 1  · Fire</text>
  <text x="1164" y="735" class="tech">DIRECT DESTINATION PORTS</text>

  <rect x="532" y="792" width="536" height="36" rx="18" fill="#173646" stroke="#4dc5df"/>
  <text x="558" y="816" class="label" font-size="14">One graph. Four physical cards. No hidden input-scope picker.</text>
</svg>
