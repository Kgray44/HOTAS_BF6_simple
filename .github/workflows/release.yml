name: Release HOTAS BF6

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test, package, and upload artifacts without publishing a GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  package:
    environment: release-signing
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify generated documentation is synchronized
        shell: pwsh
        run: .\scripts\sync-documentation.ps1 -Check

      - name: Validate release source and select release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content HOTAS_VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'HOTAS_VERSION must be major.minor.patch.' }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match HOTAS_VERSION $version."
            }
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$version"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record unsigned release build
        if: vars.ARTIFACT_SIGNING_ENABLED != 'true'
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @'
          ## UNSIGNED RELEASE BUILD

          Azure Artifact Signing is disabled. This run continues without Azure login,
          code signing, or signature-validity requirements. Stable publication is
          allowed: the installer is still built, tested, smoke-tested, checksummed,
          manifested, uploaded, and published normally. Windows reputation, Smart App
          Control, or other security features may warn about or block an unsigned build.
          '@

      - name: Install Qt 6.5.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'

      - name: Locate Qt deployment tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-ChildItem -LiteralPath $env:QT_ROOT_DIR -Recurse -Filter Qt6Config.cmake | Select-Object -First 1
          if (-not $config) { throw 'Qt6Config.cmake was not found after Qt installation.' }
          $prefix = $config.Directory.Parent.Parent.Parent.FullName
          $deploy = Join-Path $prefix 'bin\windeployqt.exe'
          if (-not (Test-Path -LiteralPath $deploy)) { throw 'windeployqt.exe was not found.' }
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDEPLOYQT=$deploy" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Lint QML declaratively
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lint = Join-Path $env:QT_PREFIX 'bin\qmllint.exe'
          if (-not (Test-Path -LiteralPath $lint -PathType Leaf)) { throw 'qmllint.exe was not found.' }
          $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            $output = & $lint "$PWD\qml\Main.qml" 2>&1 | Out-String
          } finally {
            $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
          }
          Write-Host $output
          if ($output -match '(?im)\berror:|syntax error|parse error') {
            throw 'qmllint reported a QML error.'
          }
          exit 0

      - name: Enable the matching MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate supplied application-icon sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($icon in @(
            'assets\icons\HOTAS-BF6-App.ico',
            'assets\icons\HOTAS-BF6-Launcher.ico',
            'assets\icons\HOTAS-BF6-Setup.ico',
            'assets\icons\png\hotas-bf6-256.png',
            'resources\app.rc',
            'resources\launcher.rc'
          )) {
            if (-not (Test-Path -LiteralPath $icon -PathType Leaf)) { throw "Required icon asset is missing: $icon" }
          }

      - name: Validate pinned dependency bootstrap metadata
        shell: pwsh
        run: .\scripts\validate-dependencies.ps1

      - name: Configure Release build
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" -DHOTAS_BUILD_PERFORMANCE_BENCHMARK=ON

      - name: Build mapper, launcher, and tests
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Verify mapper and launcher icon resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class HotasResourceProbe {
            [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
            public static extern IntPtr LoadLibraryEx(string fileName, IntPtr file, uint flags);
            [DllImport("kernel32.dll", SetLastError = true)]
            public static extern IntPtr FindResource(IntPtr module, IntPtr name, IntPtr type);
            [DllImport("kernel32.dll", SetLastError = true)]
            public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          foreach ($binary in @('build\HOTAS BF6.exe', 'build\HOTAS BF6 Launcher.exe')) {
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Built binary missing: $binary" }
            $module = [HotasResourceProbe]::LoadLibraryEx((Resolve-Path -LiteralPath $binary), [IntPtr]::Zero, 0x00000002)
            if ($module -eq [IntPtr]::Zero) { throw "Could not inspect resources: $binary" }
            try {
              if ([HotasResourceProbe]::FindResource($module, [IntPtr]101, [IntPtr]14) -eq [IntPtr]::Zero) {
                throw "Embedded group icon is missing: $binary"
              }
            } finally {
              [void][HotasResourceProbe]::FreeLibrary($module)
            }
          }

      - name: Run headless tests and synthetic benchmark
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mappingCoreResult = Join-Path $env:RUNNER_TEMP 'mapping-core-results.xml'
          & "$PWD\build\mapping_core_tests.exe" -v2 -o "$mappingCoreResult,xml"
          $mappingCoreExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $mappingCoreResult) {
            Get-Content -LiteralPath $mappingCoreResult -Raw
          }
          if ($mappingCoreExitCode -ne 0) {
            throw "mapping_core_tests failed with exit code $mappingCoreExitCode."
          }
          ctest --test-dir build --output-on-failure --verbose -E '^mapping_core_tests$' -C Release

      - name: Stage deployable Qt application
        shell: pwsh
        run: .\scripts\stage-package.ps1 -BuildDir "$PWD\build" -StageDir "$PWD\release\stage" -WindeployQt $env:WINDEPLOYQT

      - name: Azure login for Artifact Signing
        if: vars.ARTIFACT_SIGNING_ENABLED == 'true'
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign staged project executables with Artifact Signing
        if: vars.ARTIFACT_SIGNING_ENABLED == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\release\stage\HOTAS BF6.exe
            ${{ github.workspace }}\release\stage\HOTAS BF6 Launcher.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: HOTAS BF6 Simple
          description-url: https://github.com/Kgray44/HOTAS_BF6_simple

      - name: Verify staged project signatures
        if: vars.ARTIFACT_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          .\scripts\verify-authenticode.ps1 -Path @(
            "$PWD\release\stage\HOTAS BF6.exe",
            "$PWD\release\stage\HOTAS BF6 Launcher.exe"
          )

      - name: Install pinned Inno Setup 6.7.1 on CI
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -StageDir "$PWD\release\stage" -OutputDir "$PWD\release" -Iscc 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'

      - name: Smoke-test installer layout on CI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content HOTAS_VERSION -Raw).Trim()
          $installer = "$PWD\release\HOTAS-BF6-Setup-v$version.exe"
          $target = Join-Path $env:RUNNER_TEMP 'hotas-bf6-installer-smoke'
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$target`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer smoke install failed: $($install.ExitCode)" }
          foreach ($file in @('HOTAS BF6.exe', 'HOTAS BF6 Launcher.exe', 'VERSION')) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $file) -PathType Leaf)) {
              throw "Installer smoke test is missing $file"
            }
          }
          $uninstaller = Join-Path $target 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'Installer smoke test is missing uninstaller.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Installer smoke uninstall failed: $($uninstall.ExitCode)" }

      - name: Sign final installer with Artifact Signing
        if: vars.ARTIFACT_SIGNING_ENABLED == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\release\HOTAS-BF6-Setup-${{ env.RELEASE_TAG }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: HOTAS BF6 Simple installer
          description-url: https://github.com/Kgray44/HOTAS_BF6_simple

      - name: Verify final installer signature
        if: vars.ARTIFACT_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: .\scripts\verify-authenticode.ps1 -Path "$PWD\release\HOTAS-BF6-Setup-v$((Get-Content HOTAS_VERSION -Raw).Trim()).exe"

      - name: Generate release manifest and checksums
        shell: pwsh
        run: .\scripts\generate-release-assets.ps1 -InstallerPath "$PWD\release\HOTAS-BF6-Setup-v$((Get-Content HOTAS_VERSION -Raw).Trim()).exe" -OutputDir "$PWD\release" -ReleaseTag $env:RELEASE_TAG

      - name: Upload dry-run or diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HOTAS-BF6-${{ env.RELEASE_TAG }}
          path: |
            release/HOTAS-BF6-Setup-v*.exe
            release/update-manifest.json
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish stable GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            release/HOTAS-BF6-Setup-v*.exe
            release/update-manifest.json
            release/SHA256SUMS.txt
