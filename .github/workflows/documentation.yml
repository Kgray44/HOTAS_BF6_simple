name: Documentation Check

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Regenerate documentation
        shell: pwsh
        run: .\scripts\sync-documentation.ps1

      - name: Verify generated documentation is synchronized
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changes = @(git status --porcelain -- README.md docs/Features.md docs/Version_Overview.md)
          if ($changes.Count -eq 0) {
            Write-Host 'Generated documentation is synchronized.'
            exit 0
          }

          Write-Host 'Generated documentation differs from the committed files:'
          $changes | ForEach-Object { Write-Host $_ }
          git --no-pager diff -- README.md docs/Features.md docs/Version_Overview.md
          throw 'Generated documentation is stale. Run .\scripts\sync-documentation.ps1 and commit the generated files.'
