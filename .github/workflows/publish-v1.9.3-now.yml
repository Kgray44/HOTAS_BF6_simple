name: Publish v1.9.3 Now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.9.3-now.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin v1.9.3 to this release-source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < HOTAS_VERSION)"
          if [[ "$version" != "1.9.3" ]]; then
            echo "Expected HOTAS_VERSION 1.9.3, got $version"
            exit 1
          fi

          release_code="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v1.9.3")"
          if [[ "$release_code" == "200" ]]; then
            echo "v1.9.3 GitHub Release already exists; refusing to move the published tag."
            exit 1
          elif [[ "$release_code" != "404" ]]; then
            cat /tmp/release.json
            echo "Could not determine v1.9.3 release state (HTTP $release_code)."
            exit 1
          fi

          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1.9.3 "$GITHUB_SHA"
          git push --force origin refs/tags/v1.9.3

      - name: Dispatch the v1.9.3 publication build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"v1.9.3","inputs":{"dry_run":"false"}}'
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
              -d "$payload")"
            if [[ "$code" == "204" ]]; then
              echo "v1.9.3 release workflow dispatched successfully."
              exit 0
            fi
            echo "Dispatch attempt $attempt returned HTTP $code."
            cat /tmp/dispatch.json || true
            sleep 2
          done
          echo "Failed to dispatch v1.9.3 release workflow."
          exit 1
