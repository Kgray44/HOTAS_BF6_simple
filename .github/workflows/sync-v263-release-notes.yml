name: Sync v2.6.3 Release Notes

on:
  push:
    branches:
      - main
    paths:
      - 'docs/V2.6.3_Release_Notes.md'
      - '.github/workflows/sync-v263-release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update v2.6.3 GitHub Release body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'docs', 'V2.6.3_Release_Notes.md'), 'utf8');
            const response = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'v2.6.3',
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: response.data.id,
              name: 'v2.6.3',
              body,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            core.summary
              .addHeading('v2.6.3 release notes synchronized')
              .addRaw(`Updated release ${response.data.html_url} from docs/V2.6.3_Release_Notes.md.`)
              .write();
