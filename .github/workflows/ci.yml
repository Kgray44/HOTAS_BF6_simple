name: HOTAS BF6 CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Verify qualified toolchain alignment
        shell: pwsh
        run: .\scripts\verify-toolchain-consistency.ps1

      - name: Verify generated documentation is synchronized
        shell: pwsh
        run: .\scripts\sync-documentation.ps1 -Check

      - name: Install qualified Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'

      - name: Locate Qt tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-ChildItem -LiteralPath $env:QT_ROOT_DIR -Recurse -Filter Qt6Config.cmake | Select-Object -First 1
          if (-not $config) { throw 'Qt6Config.cmake was not found after Qt installation.' }
          $prefix = $config.Directory.Parent.Parent.Parent.FullName
          $lint = Join-Path $prefix 'bin\qmllint.exe'
          if (-not (Test-Path -LiteralPath $lint -PathType Leaf)) { throw 'qmllint.exe was not found.' }
          "QT_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QMLLINT=$lint" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Lint QML syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($qml in Get-ChildItem -LiteralPath "$PWD\qml" -Filter '*.qml') {
            Write-Host "Linting $($qml.Name)"
            & $env:QMLLINT $qml.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "qmllint failed for $($qml.Name) with exit code $LASTEXITCODE."
            }
          }

      - name: Enable matching MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate required resources and dependency bootstrap metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($asset in @(
            'assets\icons\HOTAS-BF6-App.ico',
            'assets\icons\HOTAS-BF6-Launcher.ico',
            'assets\icons\HOTAS-BF6-Setup.ico',
            'assets\icons\png\hotas-bf6-256.png',
            'resources\app.rc',
            'resources\launcher.rc',
            'LICENSE',
            'THIRD_PARTY_NOTICES.md'
          )) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Required resource is missing: $asset" }
          }
          .\scripts\validate-dependencies.ps1

      - name: Configure Release build
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" -DHOTAS_BUILD_PERFORMANCE_BENCHMARK=ON

      - name: Compile mapper launcher and all tests
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run mapping Automation launcher readiness and benchmark tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
